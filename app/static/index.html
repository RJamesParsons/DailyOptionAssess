<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Daily Option Assess</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<div id="login" class="login hide">
  <form id="loginform" class="card login-card" autocomplete="on">
    <h1>Daily Option Assess</h1>
    <p class="mute">Sign in to view your trade P&amp;L.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn primary" id="loginbtn" type="submit">Sign in</button>
    <p id="loginerr" class="loss" role="alert"></p>
  </form>
</div>

<div id="app" class="hide">
  <header class="top">
    <div class="top-in">
      <a class="brand" href="#/day">Daily Option Assess</a>
      <nav class="tabs desktop-only" id="tabs-top" aria-label="Sections"></nav>
      <div class="top-right">
        <div class="seg" role="radiogroup" aria-label="Underlyings" id="und">
          <button role="radio" data-v="" aria-checked="true">SPX / SPXW</button>
          <button role="radio" data-v="ALL" aria-checked="false">All</button>
        </div>
        <button class="btn ghost" id="logout" title="Sign out">Sign out</button>
      </div>
    </div>
  </header>

  <main id="main" class="wrap" tabindex="-1"></main>

  <nav class="tabs bottom mobile-only" id="tabs-bottom" aria-label="Sections"></nav>
</div>

<script src="/static/app.js"></script>
</body>
</html>
